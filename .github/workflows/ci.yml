name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check ..
      - run: ruff format --check ..
      - run: pytest -q --cov=app --cov-report=term-missing --cov-fail-under=80
      - name: Execute notebook
        run: jupyter nbconvert --to notebook --execute ../notebooks/analysis.ipynb --output /tmp/analysis.out.ipynb

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d --wait
      - run: curl -fsS http://localhost:8080/api/health && curl -fsS -o /dev/null http://localhost:8080/
      - if: always()
        run: docker compose down -v
